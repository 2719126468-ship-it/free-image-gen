# DSH Plugin: colab-remote
# This enables direct Colab calling from DSH's Web UI and CLI.

id: colab-remote
name: "@local/colab-remote"
version: "0.1.0"
description: "Remote GPU generation via Google Colab (Anima, SDXL, Wan2.2)"

# Tool configuration
tools:
  - name: "tool-colab-generate"
    entry: "dsh-colab-gen.py --generate"
    description: "Generate image via remote Colab session"
    params:
      - name: "prompt"
        type: "string"
        required: true
      - name: "width"
        type: "integer"
        default: 832
      - name: "height"
        type: "integer"
        default: 1216
      - name: "steps"
        type: "integer"
        default: 25
        
  - name: "tool-colab-video"
    entry: "dsh-colab-gen.py --video"
    description: "Generate video via remote Colab Wan2.2"
    params:
      - name: "prompt"
        type: "string"
        required: true
      - name: "image_path"
        type: "string"
        required: false
        
  - name: "tool-colab-health"
    entry: "dsh-colab-gen.py --health"
    description: "Check Colab session health and status"
    
  - name: "tool-colab-batch"
    entry: "dsh-colab-gen.py --batch"
    description: "Batch generate multiple images"
    params:
      - name: "prompts_file"
        type: "string"
        required: true

# Session management
session:
  max_active_sessions: 2
  session_ttl_hours: 6
  auto_restart_on_idle: true
  
# Backend configuration
backend:
  notebook_path: "examples/anima_colab.ipynb"
  diffusers_main_switch: true
  wan_video_enabled: true
  auto_fallback_to_cpu: true

# Output format
output:
  save_to_disk: true
  upload_to_drive: true
  compress_if_large: true
